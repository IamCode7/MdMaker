appId: com.maegdonaldeu.mdeditor
productName: MdMaker
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
# 라이선스 문서를 앱 안(Resources 폴더)에 함께 넣는다.
extraResources:
  - LICENSE
  - THIRD_PARTY_NOTICES.txt
fileAssociations:
  - ext: [md, markdown]
    name: Markdown
    role: Editor
# Mac: .app 하나를 zip으로 (풀면 MdMaker.app 하나, 더블클릭으로 실행)
mac:
  target: zip
  artifactName: ${productName}-v${version}-mac.${ext}
  category: public.app-category.productivity
# Windows: 설치 없이 실행되는 .exe 파일 하나
win:
  target: portable
portable:
  artifactName: ${productName}-v${version}-windows.exe
linux:
  target: AppImage
